services:
  comfyui:
    build:
      dockerfile: comfyui.Dockerfile
      args:
        # Leave empty to track the ComfyUI branch tip; set to a commit sha
        # (COMFYUI_REV=<sha> docker compose build) to pin the core build.
        COMFYUI_REV: ${COMFYUI_REV:-}
    ports:
      - 8188:8188
    runtime: nvidia
    volumes:
      - ./models:/app/models
    command:
      - "--listen"
      - "--enable-cors-header"
      - "*"
      - "--preview-method"
      - "latent2rgb"

  cozyui:
    build:
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    volumes:
      - ./docker/config.local.json:/app/conf/config.local.json